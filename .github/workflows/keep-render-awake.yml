
name: Keep Render Service Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Send keep-alive request
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            --retry 2 \
            "${RENDER_URL}"

    env:
      RENDER_URL: https://dataset-doctor-8c7b.onrender.com/
